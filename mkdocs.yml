site_name: lockfreequeues
site_description: Lock-free queues for Nim, implemented as ring buffers
site_url: https://elijahr.github.io/lockfreequeues/

repo_name: elijahr/lockfreequeues
repo_url: https://github.com/elijahr/lockfreequeues

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.instant
    - navigation.sections
    - toc.follow

exclude_docs: |
  plans/

plugins:
  - search
  - mike:
      alias_type: symlink
      canonical_version: latest
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - glightbox
  - mkdocstrings:
      default_handler: nim
      handlers:
        nim:
          paths: [src]
          options:
            docstring_style: rst
            show_source: true
            show_signature: true
            heading_level: 3  # h3 so procs nest under h2 API section in TOC
            source_url: https://github.com/elijahr/lockfreequeues
            # source_ref drives the github blob URL stamped on each
            # source-link. Auto-detection from the working tree fails on
            # CI (actions/checkout produces a detached HEAD), so we read
            # it from DOCS_SOURCE_REF and default to `devel` (this repo's
            # default branch — verified via gh repo view) so local
            # `mkdocs serve` produces working source links without env
            # setup. CI exports the right value per trigger: PR -> head
            # ref, devel push -> devel, v* tag -> tag name.
            source_ref: !ENV [DOCS_SOURCE_REF, devel]

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 4  # Include h2, h3, h4 in right-side TOC

nav:
  - Home: index.md
  - API Reference:
    - Overview: api/index.md
    - Bounded Queues:
      - Sipsic: api/sipsic.md
      - Sipmuc: api/sipmuc.md
      - Mupsic: api/mupsic.md
      - Mupmuc: api/mupmuc.md
    - Unbounded Queues:
      - UnboundedSipsic: api/unbounded_sipsic.md
      - UnboundedSipmuc: api/unbounded_sipmuc.md
      - UnboundedMupsic: api/unbounded_mupsic.md
      - UnboundedMupmuc: api/unbounded_mupmuc.md
  - Concepts:
    - Safety Model: safety-model.md
    - Slot Ownership Typestates: slot-ownership-typestates.md
  - Benchmarks: benchmarks.md
  - Examples: examples.md

watch:
  - docs
  - docs/api
  - src
  - src/lockfreequeues

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/elijahr/lockfreequeues

extra_css:
  - css/custom.css
