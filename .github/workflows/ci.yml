name: CI
on:
  push:
    branches: [devel]
  pull_request:
  schedule:
    - cron: "0 6 * * 1,4"

permissions: {}

jobs:
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install and run Gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --verbose --redact

  test-nim:
    name: Nim (${{ matrix.nim-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        nim-version: [stable, "2.2.10", devel]
    steps:
      - uses: actions/checkout@v7

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}
          parent-nim-install-directory: ${{ runner.temp }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache nimble packages
        uses: actions/cache@v6
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ runner.arch }}-${{ matrix.nim-version }}-${{ hashFiles('**/*.nimble') }}
          restore-keys: |
            nimble-${{ runner.os }}-${{ runner.arch }}-${{ matrix.nim-version }}-
            nimble-${{ runner.os }}-${{ runner.arch }}-
          save-always: true

      - name: Cache Nim nimcache
        uses: actions/cache@v6
        with:
          path: ~/.cache/nim
          key: nimcache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.nim-version }}-${{ hashFiles('**/*.nimble', 'src/**/*.nim', 'tests/**/*.nim') }}
          restore-keys: |
            nimcache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.nim-version }}-
          save-always: true

      - name: Install dependencies
        run: |
          (cd /tmp && nimble refresh && nimble install -y "lockfree@0.6.7")
          nimble install -d -y || true

      - name: nph format check
        if: matrix.nim-version == 'stable'
        run: |
          nimble install -y nph@0.7.0
          nph --check .

      - name: nimble check
        if: matrix.nim-version == 'stable'
        run: nimble check

      - name: Test
        run: nimble test
        continue-on-error: ${{ matrix.nim-version == 'devel' }}
