# yamllint disable rule:line-length

name: bench

# yamllint disable rule:truthy
on:
  # Only fire on PRs that actually target an integration branch. Stacked
  # feature-to-feature PRs (`feat/foo` -> `feat/bar`) used to be in this
  # allowlist; they have been removed because cascade-rebases would
  # otherwise burn Bencher quota uploading near-identical reports for
  # every intermediate stack PR. The topmost PR (base=devel) still gets
  # PR-time bench treatment, gated further by the `bench` label below.
  pull_request:
    branches: [main, devel]
    paths-ignore:
      - '*.md'
      - '.github/workflows/docs.yml'
  push:
    branches: [main, devel]
    paths-ignore:
      - '*.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
# yamllint enable rule:truthy

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Exposed at job env so step-level `if:` expressions can gate on
  # presence via `env.BENCHER_API_TOKEN`. GitHub Actions does not allow
  # `secrets.*` directly in `if:`, so the env-var indirection is required.
  BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}

jobs:
  bench-tests:
    # Compiles and runs `tests/t_bench_*.nim` (the bench harness's own
    # unit tests). Lives in bench.yml because the bench harness itself
    # is what these tests exercise, but takes no secrets — fork PRs
    # are allowed so contributors get the same harness validation as
    # maintainer pushes. The bot-actor guard prevents loop-back from
    # the bench-snapshot push commit (see docs.yml). Sibling Nim deps
    # are pinned to tagged releases (not `main`) for deterministic CI;
    # bump in lockstep with build.yml/bench.yml's `benchmark` job and
    # lockfreequeues.nimble's `requires`.
    name: bench-tests (ubuntu-latest)
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    timeout-minutes: 10

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install build deps (Linux)
        run: |
          sudo apt-get update -q -y
          sudo apt-get -qq install -y clang

      - name: Clone and install sibling Nim deps (nim-debra, nim-typestates)
        run: |
          set -e
          cd ..
          git clone --depth 1 --branch v0.6.0 https://github.com/elijahr/nim-debra.git
          git clone --depth 1 --branch v0.7.0 https://github.com/elijahr/nim-typestates.git
          (cd nim-typestates && nimble install -y)
          (cd nim-debra && nimble install -y)

      - name: Vendor unittest2
        run: git clone --depth 1 https://github.com/status-im/nim-unittest2.git deps/unittest2

      - name: Run bench harness tests
        run: nimble benchtests

  bench-throughput:
    name: Throughput bench (ubuntu-latest)
    runs-on: ubuntu-latest
    # PRs from forks cannot read BENCHER_API_TOKEN. Skip rather than fail
    # noisily; maintainer pushes / merges still record the baseline.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30

    steps:
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: ${HOME}/.cache
          key: cache-bench-throughput-${{ runner.os }}

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install build deps (Linux)
        run: |
          sudo apt-get update -q -y
          sudo apt-get -qq install -y clang

      - name: Clone and install sibling Nim deps (nim-debra, nim-typestates)
        # Mirrors build.yml: nim.cfg uses --path:"../nim-debra/src" and
        # --path:"../nim-typestates/src", and nimble's resolver runs before
        # the compiler so we must install matching tags locally. Pin to
        # specific release tags (not `main`) for deterministic CI; bump in
        # lockstep with build.yml and lockfreequeues.nimble's `requires`.
        run: |
          set -e
          cd ..
          git clone --depth 1 --branch v0.6.0 https://github.com/elijahr/nim-debra.git
          git clone --depth 1 --branch v0.7.0 https://github.com/elijahr/nim-typestates.git
          (cd nim-typestates && nimble install -y)
          (cd nim-debra && nimble install -y)

      - name: Vendor unittest2
        run: git clone --depth 1 https://github.com/status-im/nim-unittest2.git deps/unittest2

      - name: Compile bench_throughput (CI-tuned run shape)
        # Cloud runs use a tighter wall-clock budget than the local default
        # (1M messages × 33 runs). Bounded variants (sipsic, channels) use
        # 1M × 5 runs and finish in single-digit seconds. unbounded_mupsic
        # is super-linear in message count and is gated separately via
        # UnboundedMupsicMessageCount=500000 + UnboundedMupsicRuns=3 to keep
        # the variant tractable inside the 30-min job budget. Warmup stays
        # at 2 to absorb JIT/cache effects.
        run: |
          nim c -d:release -d:danger --threads:on \
            -d:MessageCount=1000000 \
            -d:DefaultRuns=5 \
            -d:WarmupRuns=2 \
            -d:UnboundedMupsicRuns=3 \
            -d:UnboundedMupsicMessageCount=500000 \
            benchmarks/nim/bench_throughput.nim

      - name: Run bench_throughput
        # mupmuc 4P/4C livelock fixed via CAS-retry backoff; see backoff
        # changelog. Step-level timeout: if any single variant hangs, fail
        # fast inside the 30-min job budget so the upload step still
        # records the partial result rather than burning the entire
        # budget on one variant.
        timeout-minutes: 20
        run: |
          ./.tmp/bench_throughput --bmf-out=throughput.json \
            sipsic mupmuc unbounded_mupsic channels | tee bench_output.txt

      - name: Upload throughput BMF artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-throughput-bmf
          path: throughput.json

  bench-latency:
    # Sibling job to bench-throughput. Builds bench_latency.nim and emits a
    # latency.json BMF fragment that the bench-upload job merges with the
    # throughput fragment before a single `bencher run` upload — multiple
    # `bencher run` invocations create separate Bencher Reports and would
    # NOT co-locate latency + throughput measures on the shared per-slug
    # history (design 1 / impl plan Track 1).
    name: Latency bench (ubuntu-latest)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 12

    steps:
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: ${HOME}/.cache
          key: cache-bench-latency-${{ runner.os }}

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install build deps (Linux)
        run: |
          sudo apt-get update -q -y
          sudo apt-get -qq install -y clang

      - name: Clone and install sibling Nim deps (nim-debra, nim-typestates)
        run: |
          set -e
          cd ..
          git clone --depth 1 --branch main https://github.com/elijahr/nim-debra.git
          git clone --depth 1 --branch main https://github.com/elijahr/nim-typestates.git
          (cd nim-typestates && nimble install -y)
          (cd nim-debra && nimble install -y)

      - name: Vendor unittest2
        run: git clone --depth 1 https://github.com/status-im/nim-unittest2.git deps/unittest2

      - name: Compile bench_latency (CI-tuned run shape)
        # 100K-message default × 33 runs would bust the 12-min budget on a
        # CI runner with one ping-pong RTT pair per run. Cloud uses a
        # tighter shape: 50K × 11 runs × 2 warmup ≈ 1.5M total RTTs across
        # 4 variants. Each RTT is sub-microsecond on Linux x86_64; that
        # gives ~3-4s per variant, well inside the budget.
        run: |
          nim c -d:release -d:danger --threads:on \
            -d:BenchLatencyMessageCount=50000 \
            -d:BenchLatencyRuns=11 \
            -d:BenchLatencyWarmupRuns=2 \
            benchmarks/nim/bench_latency.nim

      - name: Run bench_latency
        # Step-level timeout: latency runs are bounded but a runtime
        # failure (lost message, missed wakeup) would spin a ponger
        # thread forever. Fail fast inside the 12-min budget.
        timeout-minutes: 10
        run: |
          ./.tmp/bench_latency --bmf-out=latency.json \
            sipsic mupmuc sipmuc mupsic | tee latency_output.txt

      - name: Upload latency BMF artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-latency-bmf
          path: latency.json

  bench-upload:
    # Merges per-binary BMF artifacts into a single JSON before a single
    # `bencher run` invocation. Bencher creates a separate Report per
    # invocation; multiple uploads would NOT co-locate measures on a
    # single per-slug history (design 1 / Track 1 Task 1.4).
    name: Merge BMF + Bencher upload (ubuntu-latest)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [bench-throughput, bench-latency]
    permissions:
      contents: read
      actions: read
      pull-requests: write
      checks: write
    timeout-minutes: 10

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download BMF artifacts
        # Pattern matches both bench-throughput-bmf and bench-latency-bmf
        # (and any future per-binary artifact uploaded by PR 2's topology
        # split, which uses the same `bench-*-bmf` naming convention).
        # Each artifact downloads into its own subdirectory under
        # `bmf-inputs/<artifact-name>/` (no `merge-multiple`) so two
        # artifacts that happen to contain a same-named file (e.g. both
        # write `throughput.json`) cannot overwrite each other.
        uses: actions/download-artifact@v4
        with:
          pattern: bench-*-bmf
          path: ./bmf-inputs/

      - name: List BMF inputs (debug)
        run: find bmf-inputs/ -type f -name '*.json' -print

      - name: Merge BMF JSON
        # `merge_bmf.py` unions per-slug measure dicts across N inputs and
        # exits 1 on (slug, measure) collisions. Pure stdlib (no third-
        # party deps), so no Python install step is needed beyond the
        # ubuntu-latest default.
        #
        # Inputs live one subdir deep (no `merge-multiple`); enumerate
        # all `*.json` recursively. `xargs` arranges argv splitting; we
        # NUL-delimit to be robust against any future filename quirks.
        run: |
          find bmf-inputs/ -type f -name '*.json' -print0 | \
            xargs -0 python3 benchmarks/merge_bmf.py merged.json

      - name: Show BMF JSON (debug)
        run: cat merged.json

      - name: Install Bencher CLI
        uses: bencherdev/bencher@main

      - name: Bencher upload preflight
        # Always runs. Surfaces a yellow PR-check warning whenever the
        # downstream `bencher run` would be skipped, so the reason is
        # obvious from the check summary rather than the bench silently
        # appearing to "do nothing" with the data. Skip reasons:
        #   1. BENCHER_API_TOKEN secret unset (any event)
        #   2. PR event without the `bench` label (cost gate — Bencher
        #      ingest charges per metric, so PR comparisons are opt-in
        #      via label rather than firing on every cascade-rebase push)
        # Push to main/devel and workflow_dispatch never need the label.
        run: |
          if [ -z "$BENCHER_API_TOKEN" ]; then
            echo "::warning title=Bencher upload skipped::BENCHER_API_TOKEN secret is not set on this repo. The bench ran successfully and produced merged.json (visible in the 'Show BMF JSON (debug)' step), but no data is being uploaded to Bencher.dev. Set up the project at bencher.dev with slug 'lockfreequeues' and add BENCHER_API_TOKEN as a repo secret to enable upload."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && ! ${{ contains(github.event.pull_request.labels.*.name, 'bench') }}; then
            echo "::warning title=Bencher upload skipped::This is a pull_request event but the PR does not carry the 'bench' label. PR-time Bencher uploads are opt-in to control metric-ingest costs. Add the 'bench' label to the PR and re-run this workflow if you want a Bencher comparison report on this revision."
            exit 0
          fi
          echo "Bencher upload preconditions met; proceeding."

      # PR runs: compare against base branch and post a comment.
      # Gated on the `bench` PR label so cascade-rebases of stacked PRs
      # do not burn Bencher quota; add the label deliberately when you
      # want a comparison report.
      - name: Track PR benchmarks with Bencher
        if: |
          github.event_name == 'pull_request'
          && env.BENCHER_API_TOKEN != ''
          && contains(github.event.pull_request.labels.*.name, 'bench')
        run: |
          bencher run \
            --project lockfreequeues \
            --token '${{ secrets.BENCHER_API_TOKEN }}' \
            --branch "$GITHUB_HEAD_REF" \
            --start-point "$GITHUB_BASE_REF" \
            --start-point-hash '${{ github.event.pull_request.base.sha }}' \
            --start-point-clone-thresholds \
            --start-point-reset \
            --testbed ubuntu-latest \
            --adapter json \
            --file merged.json \
            --github-actions '${{ secrets.GITHUB_TOKEN }}' \
            --err

      # Push to main/devel: record the baseline for that branch.
      - name: Track base branch benchmarks with Bencher
        if: github.event_name == 'push' && env.BENCHER_API_TOKEN != ''
        run: |
          bencher run \
            --project lockfreequeues \
            --token '${{ secrets.BENCHER_API_TOKEN }}' \
            --branch "${GITHUB_REF##*/}" \
            --testbed ubuntu-latest \
            --threshold-measure throughput \
            --threshold-test t_test \
            --threshold-max-sample-size 64 \
            --threshold-lower-boundary 0.99 \
            --thresholds-reset \
            --adapter json \
            --file merged.json \
            --github-actions '${{ secrets.GITHUB_TOKEN }}' \
            --err

      # workflow_dispatch: just upload, no comparison.
      - name: Track manual benchmarks with Bencher
        if: github.event_name == 'workflow_dispatch' && env.BENCHER_API_TOKEN != ''
        run: |
          bencher run \
            --project lockfreequeues \
            --token '${{ secrets.BENCHER_API_TOKEN }}' \
            --branch "${GITHUB_REF##*/}" \
            --testbed ubuntu-latest \
            --adapter json \
            --file merged.json
