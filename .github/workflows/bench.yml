# yamllint disable rule:line-length

name: bench

# yamllint disable rule:truthy
on:
  # Only fire on PRs that actually target an integration branch. Stacked
  # feature-to-feature PRs (`feat/foo` -> `feat/bar`) used to be in this
  # allowlist; they have been removed because cascade-rebases would
  # otherwise burn Bencher quota uploading near-identical reports for
  # every intermediate stack PR. The topmost PR (base=devel) still gets
  # PR-time bench treatment, gated further by the `bench` label below.
  pull_request:
    branches: [main, devel]
    paths-ignore:
      - '*.md'
      - '.github/workflows/docs.yml'
  push:
    branches: [main, devel]
    paths-ignore:
      - '*.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
# yamllint enable rule:truthy

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Exposed at job env so step-level `if:` expressions can gate on
  # presence via `env.BENCHER_API_TOKEN`. GitHub Actions does not allow
  # `secrets.*` directly in `if:`, so the env-var indirection is required.
  BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}

jobs:
  benchmark:
    name: Throughput bench (ubuntu-latest)
    runs-on: ubuntu-latest
    # PRs from forks cannot read BENCHER_API_TOKEN. Skip rather than fail
    # noisily; maintainer pushes / merges still record the baseline.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      checks: write
    timeout-minutes: 30

    steps:
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: ${HOME}/.cache
          key: cache-bench-${{ runner.os }}

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install build deps (Linux)
        run: |
          sudo apt-get update -q -y
          sudo apt-get -qq install -y clang

      - name: Clone and install sibling Nim deps (nim-debra, nim-typestates)
        # Mirrors build.yml: nim.cfg uses --path:"../nim-debra/src" and
        # --path:"../nim-typestates/src", and nimble's resolver runs before
        # the compiler so we must install matching tags locally. Pin to
        # specific release tags (not `main`) for deterministic CI; bump in
        # lockstep with build.yml and lockfreequeues.nimble's `requires`.
        run: |
          set -e
          cd ..
          git clone --depth 1 --branch v0.6.0 https://github.com/elijahr/nim-debra.git
          git clone --depth 1 --branch v0.7.0 https://github.com/elijahr/nim-typestates.git
          (cd nim-typestates && nimble install -y)
          (cd nim-debra && nimble install -y)

      - name: Vendor unittest2
        run: git clone --depth 1 https://github.com/status-im/nim-unittest2.git deps/unittest2

      - name: Compile bench_throughput (CI-tuned run shape)
        # Cloud runs use a tighter wall-clock budget than the local default
        # (1M messages × 33 runs). Bounded variants (sipsic, channels) use
        # 1M × 5 runs and finish in single-digit seconds. unbounded_mupsic
        # is super-linear in message count and is gated separately via
        # UnboundedMupsicMessageCount=500000 + UnboundedMupsicRuns=3 to keep
        # the variant tractable inside the 30-min job budget. Warmup stays
        # at 2 to absorb JIT/cache effects.
        #
        # Counts are 10x the previous values (100k / 50k → 1M / 500k) and
        # the bench timer is microsecond/nanosecond-precision (computed in
        # ns, printed as `mean: <N>.1f ops/ms`). Together this gives non-zero
        # stddev and >1-decimal resolution between runs on the fast CI
        # runner; previously a 50k unbounded_mupsic run completed in ~3 ms,
        # so multiple samples bucketed into the same integer ms and stddev
        # was reported as 0. The new shape costs roughly 30-60s on CI: well
        # inside the 30-min job budget while giving the timer enough
        # wall-clock spread to produce a stable, comparable signal.
        run: |
          nim c -d:release -d:danger --threads:on \
            -d:MessageCount=1000000 \
            -d:DefaultRuns=5 \
            -d:WarmupRuns=2 \
            -d:UnboundedMupsicRuns=3 \
            -d:UnboundedMupsicMessageCount=500000 \
            benchmarks/nim/bench_throughput.nim

      - name: Run bench_throughput
        # mupmuc 4P/4C livelock fixed via CAS-retry backoff; ref issue #15.
        # Step-level timeout: if any single variant hangs, fail fast inside
        # the 30-min job budget so Bencher upload steps still run (or are
        # visibly skipped) instead of burning the entire budget on one variant.
        # `--bmf-out=throughput.json` emits Bencher Metric Format JSON
        # natively (Task 0.10); the legacy stdout->bmf_adapter.py regex
        # parser is gone (Task 0.12).
        timeout-minutes: 20
        run: |
          ./.tmp/bench_throughput --bmf-out=throughput.json \
            sipsic mupmuc unbounded_mupsic channels | tee bench_output.txt

      - name: Merge BMF JSON
        # Single-input merge today, but the bench-rollup feature splits
        # bench_throughput into per-topology binaries in PR 2-4 each
        # producing its own throughput.json fragment. Calling merge_bmf.py
        # now keeps the workflow unchanged when those fragments arrive.
        run: python3 benchmarks/merge_bmf.py merged.json throughput.json

      - name: Show BMF JSON (debug)
        run: cat merged.json

      - name: Install Bencher CLI
        uses: bencherdev/bencher@main

      - name: Bencher upload preflight
        # Always runs. Surfaces a yellow PR-check warning whenever the
        # downstream `bencher run` would be skipped, so the reason is
        # obvious from the check summary rather than the bench silently
        # appearing to "do nothing" with the data. Skip reasons:
        #   1. BENCHER_API_TOKEN secret unset (any event)
        #   2. PR event without the `bench` label (cost gate — Bencher
        #      ingest charges per metric, so PR comparisons are opt-in
        #      via label rather than firing on every cascade-rebase push)
        # Push to main/devel and workflow_dispatch never need the label.
        run: |
          if [ -z "$BENCHER_API_TOKEN" ]; then
            echo "::warning title=Bencher upload skipped::BENCHER_API_TOKEN secret is not set on this repo. The bench ran successfully and produced merged.json (visible in the 'Show BMF JSON (debug)' step), but no data is being uploaded to Bencher.dev. Set up the project at bencher.dev with slug 'lockfreequeues' and add BENCHER_API_TOKEN as a repo secret to enable upload."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && ! ${{ contains(github.event.pull_request.labels.*.name, 'bench') }}; then
            echo "::warning title=Bencher upload skipped::This is a pull_request event but the PR does not carry the 'bench' label. PR-time Bencher uploads are opt-in to control metric-ingest costs. Add the 'bench' label to the PR and re-run this workflow if you want a Bencher comparison report on this revision."
            exit 0
          fi
          echo "Bencher upload preconditions met; proceeding."

      # PR runs: compare against base branch and post a comment.
      # Gated on the `bench` PR label so cascade-rebases of stacked PRs
      # do not burn Bencher quota; add the label deliberately when you
      # want a comparison report.
      - name: Track PR benchmarks with Bencher
        if: |
          github.event_name == 'pull_request'
          && env.BENCHER_API_TOKEN != ''
          && contains(github.event.pull_request.labels.*.name, 'bench')
        run: |
          bencher run \
            --project lockfreequeues \
            --token '${{ secrets.BENCHER_API_TOKEN }}' \
            --branch "$GITHUB_HEAD_REF" \
            --start-point "$GITHUB_BASE_REF" \
            --start-point-hash '${{ github.event.pull_request.base.sha }}' \
            --start-point-clone-thresholds \
            --start-point-reset \
            --testbed ubuntu-latest \
            --adapter json \
            --file merged.json \
            --github-actions '${{ secrets.GITHUB_TOKEN }}' \
            --err

      # Push to main/devel: record the baseline for that branch.
      - name: Track base branch benchmarks with Bencher
        if: github.event_name == 'push' && env.BENCHER_API_TOKEN != ''
        run: |
          bencher run \
            --project lockfreequeues \
            --token '${{ secrets.BENCHER_API_TOKEN }}' \
            --branch "${GITHUB_REF##*/}" \
            --testbed ubuntu-latest \
            --threshold-measure throughput \
            --threshold-test t_test \
            --threshold-max-sample-size 64 \
            --threshold-lower-boundary 0.99 \
            --thresholds-reset \
            --adapter json \
            --file merged.json \
            --github-actions '${{ secrets.GITHUB_TOKEN }}' \
            --err

      # workflow_dispatch: just upload, no comparison.
      - name: Track manual benchmarks with Bencher
        if: github.event_name == 'workflow_dispatch' && env.BENCHER_API_TOKEN != ''
        run: |
          bencher run \
            --project lockfreequeues \
            --token '${{ secrets.BENCHER_API_TOKEN }}' \
            --branch "${GITHUB_REF##*/}" \
            --testbed ubuntu-latest \
            --adapter json \
            --file merged.json
