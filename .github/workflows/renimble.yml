name: Renimble Dependency Updates

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  renimble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: elijahr/renimble@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
