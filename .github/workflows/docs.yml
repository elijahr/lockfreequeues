name: docs

on:
  push:
    branches:
      - main
      - master
      - devel
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install dependencies
        run: |
          pip install -r docs-requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages
        run: |
          git fetch origin gh-pages --depth=1 || true

      - name: Deploy docs (versioned)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mike deploy --push --update-aliases $VERSION latest
          mike set-default --push latest

      - name: Deploy docs (dev)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/devel'
        run: |
          mike deploy --push dev

      # Track 5 PR 5 Task 5.6 (design §5.Y): verify the chart's data
      # endpoint is reachable AND parses as JSON after every dev
      # deploy. The chart fails silently on a 404 (it renders an
      # inline error rather than crashing the page) so without this
      # check a broken asset path would only surface via user reports.
      # `sleep 30` accommodates GitHub Pages CDN propagation; raise to
      # 60 if this step ever flakes.
      - name: Verify mike asset path
        if: |
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/master' ||
          github.ref == 'refs/heads/devel'
        run: |
          set -euo pipefail
          URL="https://elijahr.github.io/lockfreequeues/dev/assets/bench-results/latest.json"
          sleep 30
          HTTP_CODE=$(curl -sS -o /tmp/latest.json -w "%{http_code}" "$URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::mike asset endpoint returned HTTP $HTTP_CODE for $URL"
            exit 1
          fi
          python3 -c "import json; json.load(open('/tmp/latest.json'))"
          echo "::notice::mike asset endpoint OK: $URL"
