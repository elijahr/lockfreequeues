name: docs

on:
  push:
    branches:
      - main
      - master
      - devel
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - '.github/workflows/docs.yml'
      - 'src/**'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'   # daily at 05:17 UTC; redeploys docs to pick up
                           # snapshot pushes that carried [skip ci] (per
                           # bench.yml Patch A) so the chart is at most
                           # ~24h stale even if devel is quiet.

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.8'

      - name: Cache Nimble packages
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-docs-${{ hashFiles('*.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nimble-docs-

      - name: Install Nim compiler API package (for mkdocstrings-nim)
        # mkdocstrings-nim's extractor.nim does `import compiler/[ast, parser, ...]`,
        # which expects Nim's compiler/ source tree to be importable. Installing
        # the `nim` Nimble package places the compiler source on the Nimble path
        # so `import compiler/<X>` resolves cleanly. This matches the typestates
        # repo's docs.yml pattern and replaces the previous in-place nim.cfg
        # patching (preserved as a ROLLBACK comment at bottom of file).
        run: nimble install nim -y

      - name: Create watch directories
        run: mkdir -p docs/overrides

      - name: Install dependencies
        run: |
          pip install -r docs-requirements.txt

      - name: Resolve docs source ref
        # mkdocs.yml reads source_ref from $DOCS_SOURCE_REF (with default
        # `devel` — the repo's default branch). Set it explicitly per
        # trigger so mkdocstrings-nim does not warn about a detached-HEAD
        # branch lookup (warning becomes error under
        # `mkdocs build --strict`):
        #   pull_request    -> the PR head branch (so blob URLs in the
        #                      PR-verified build point at the branch
        #                      under review)
        #   v* tag          -> the tag (versioned docs link to release sha)
        #   devel push      -> devel
        #   main push       -> main
        #   workflow_dispatch -> branch name
        id: docs_ref
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              ref="${GITHUB_HEAD_REF}"
              ;;
            push)
              if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                ref="${GITHUB_REF#refs/tags/}"
              else
                ref="${GITHUB_REF#refs/heads/}"
              fi
              ;;
            workflow_dispatch)
              ref="${GITHUB_REF#refs/heads/}"
              ;;
            *)
              ref="devel"
              ;;
          esac
          echo "DOCS_SOURCE_REF=$ref" >> "$GITHUB_ENV"
          echo "Resolved DOCS_SOURCE_REF=$ref"

      - name: Build docs (PR verification, no deploy)
        # On pull_request runs we only build to verify the docs compile;
        # we deliberately skip mike + git push so PR branches never touch
        # gh-pages. This catches mkdocstrings-nim regressions, broken
        # internal links, and missing nav entries before merge.
        if: github.event_name == 'pull_request'
        run: |
          mkdocs build --strict --clean

      - name: Configure git
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin gh-pages --depth=1 || true

      - name: Deploy docs (versioned)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest

      - name: Deploy docs (dev)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/devel'
        run: |
          mike deploy --push dev

      # Track 5 PR 5 Task 5.6 (design §5.Y): verify the chart's data
      # endpoint is reachable AND parses as JSON after every dev
      # deploy. The chart fails silently on a 404 (it renders an
      # inline error rather than crashing the page) so without this
      # check a broken asset path would only surface via user reports.
      # `sleep 30` accommodates GitHub Pages CDN propagation; raise to
      # 60 if this step ever flakes.
      - name: Verify mike asset path
        # Derive the Pages URL from the repository context so a fork or
        # repo rename does not falsely fail this verification step. The
        # default GitHub Pages URL convention is
        # `https://<owner>.github.io/<repo>/`. If the project ever moves
        # to a custom domain the URL becomes wrong again, but at that
        # point we'd update the workflow to read site_url from
        # mkdocs.yml; for now the convention is stable.
        if: |
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/master' ||
          github.ref == 'refs/heads/devel'
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          URL="https://${OWNER}.github.io/${REPO}/dev/assets/bench-results/latest.json"
          sleep 30
          HTTP_CODE=$(curl -sS -o /tmp/latest.json -w "%{http_code}" "$URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::mike asset endpoint returned HTTP $HTTP_CODE for $URL"
            exit 1
          fi
          python3 -c "import json; json.load(open('/tmp/latest.json'))"
          echo "::notice::mike asset endpoint OK: $URL"

### ROLLBACK ###
# If `nimble install nim -y` ever breaks (registry change, package rename,
# layout regression), revert the "Install Nim compiler API package" step
# to the previous in-place nim.cfg patch:
#   - locate nim_root via `dirname (dirname (readlink -f $(which nim)))`
#   - append `path="$lib/.."` to `$nim_root/config/nim.cfg`
# Remove this rollback block after one release cycle (v4.3.0).
