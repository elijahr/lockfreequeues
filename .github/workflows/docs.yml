name: docs

on:
  # No v* tag-push trigger: release.yml owns versioned deploys and dispatches
  # this workflow with deploy_version after each release. A tag-push trigger
  # would never fire for the bot's GITHUB_TOKEN-pushed tag anyway, and on a
  # manual tag push it would double-deploy alongside release.yml's dispatch.
  push:
    branches:
      - main
      - master
      - devel
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - '.github/workflows/docs.yml'
      - 'src/**'
  workflow_dispatch:
    inputs:
      deploy_version:
        description: 'Release version to deploy as versioned docs + latest alias (e.g. 4.2.0). Leave empty to (re)deploy dev.'
        required: false
        default: ''
  schedule:
    - cron: '17 5 * * *'   # daily at 05:17 UTC; redeploys docs to pick up
                           # snapshot pushes that carried [skip ci] (per
                           # bench.yml Patch A) so the chart is at most
                           # ~24h stale even if devel is quiet.

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A versioned-docs dispatch builds from the release tag so blob
          # links and mkdocstrings sources point at the released sha.
          ref: ${{ inputs.deploy_version != '' && format('v{0}', inputs.deploy_version) || '' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.8'

      - name: Cache Nimble packages
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-docs-${{ hashFiles('*.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nimble-docs-

      - name: Install Nim compiler API package (for mkdocstrings-nim)
        # mkdocstrings-nim's extractor.nim does `import compiler/[ast, parser, ...]`,
        # which expects Nim's compiler/ source tree to be importable. Installing
        # the `nim` Nimble package places the compiler source on the Nimble path
        # so `import compiler/<X>` resolves cleanly. This matches the typestates
        # repo's docs.yml pattern and replaces the previous in-place nim.cfg
        # patching (preserved as a ROLLBACK comment at bottom of file).
        run: nimble install nim -y

      - name: Create watch directories
        run: mkdir -p docs/overrides

      - name: Install dependencies
        run: |
          pip install -r docs-requirements.txt

      - name: JS syntax check (bench-charts.js)
        # Catches typos that mkdocs --strict treats as opaque static
        # assets. See Phase 4.6.3 green mirage audit; cheap defense
        # against ships-to-prod browser-console errors. Node is
        # preinstalled on GitHub-hosted ubuntu runners so no
        # actions/setup-node step is required.
        run: |
          node --check docs/assets/bench-charts.js

      - name: Resolve docs source ref
        # mkdocs.yml reads source_ref from $DOCS_SOURCE_REF (with default
        # `devel` — the repo's default branch). Set it explicitly per
        # trigger so mkdocstrings-nim does not warn about a detached-HEAD
        # branch lookup (warning becomes error under
        # `mkdocs build --strict`):
        #   pull_request    -> the PR head branch (so blob URLs in the
        #                      PR-verified build point at the branch
        #                      under review)
        #   devel push      -> devel
        #   main push       -> main
        #   workflow_dispatch (deploy_version set) -> the release tag
        #   workflow_dispatch (no input) -> branch name
        id: docs_ref
        env:
          DEPLOY_VERSION: ${{ inputs.deploy_version }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              ref="${GITHUB_HEAD_REF}"
              ;;
            push)
              ref="${GITHUB_REF#refs/heads/}"
              ;;
            workflow_dispatch)
              if [[ -n "${DEPLOY_VERSION}" ]]; then
                ref="v${DEPLOY_VERSION}"
              else
                ref="${GITHUB_REF#refs/heads/}"
              fi
              ;;
            *)
              ref="devel"
              ;;
          esac
          echo "DOCS_SOURCE_REF=$ref" >> "$GITHUB_ENV"
          echo "Resolved DOCS_SOURCE_REF=$ref"

      - name: Build docs (PR verification, no deploy)
        # On pull_request runs we only build to verify the docs compile;
        # we deliberately skip mike + git push so PR branches never touch
        # gh-pages. This catches mkdocstrings-nim regressions, broken
        # internal links, and missing nav entries before merge.
        if: github.event_name == 'pull_request'
        run: |
          mkdocs build --strict --clean

      - name: Configure git
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin gh-pages --depth=1 || true

      - name: Deploy docs (versioned)
        # Fired by release.yml's workflow_dispatch (carrying deploy_version)
        # after it creates a GitHub Release.
        if: inputs.deploy_version != ''
        env:
          DEPLOY_VERSION: ${{ inputs.deploy_version }}
        run: |
          mike deploy --push --update-aliases "$DEPLOY_VERSION" latest
          mike set-default --push latest

      - name: Deploy docs (dev)
        # A versioned-docs dispatch carries deploy_version and runs with
        # --ref devel, so guarding the whole condition on an empty
        # deploy_version is what keeps it from clobbering the dev alias with
        # release-tag content (the github.ref == refs/heads/devel branch
        # would otherwise fire on that dispatch).
        if: inputs.deploy_version == '' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/devel')
        run: |
          mike deploy --push dev

      # NOTE: `latest.json` freshness is bench.yml's concern, not docs.yml's.
      # bench-upload commits the snapshot to docs/assets/bench-results/ and
      # then dispatches this workflow (see bench.yml `Trigger docs redeploy`
      # step) so the next run picks up the fresh JSON. The chart's
      # example.json fallback (PR #29) handles transient 404s during the
      # gap between docs deploy and bench publication.

### ROLLBACK ###
# If `nimble install nim -y` ever breaks (registry change, package rename,
# layout regression), revert the "Install Nim compiler API package" step
# to the previous in-place nim.cfg patch:
#   - locate nim_root via `dirname (dirname (readlink -f $(which nim)))`
#   - append `path="$lib/.."` to `$nim_root/config/nim.cfg`
# Remove this rollback block after one release cycle (v4.3.0).
