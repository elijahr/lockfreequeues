# yamllint disable rule:line-length

name: build

# yamllint disable rule:truthy
on:
  pull_request:
    paths-ignore:
      - '*.md'
  push:
    paths-ignore:
      - '*.md'
# yamllint enable rule:truthy

# Cancel superseded runs on the same ref so a force-push or rapid
# successive pushes don't burn matrix-minutes on stale revisions.
# Scoped per (workflow, ref) so unrelated branches stay isolated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  lint:
    name: Lint (typestates verify)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install dependencies from nimble registry
        run: |
          nimble install -dy
          nimble setup
          # Hand-fix typestates v0.12.0 srcDir flattening: nimble setup
          # writes nimble.paths with a trailing /src component pointing
          # inside the typestates pkg dir, but typestates v0.12.0
          # ships its sources flat (no src/ subdir). Create a self-
          # referential `src` symlink inside the pkg so both layouts
          # resolve.
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done

      - name: Typestates verify
        run: typestates verify -W --format=github src/

  test:
    name: Test nim-${{ matrix.nim-version }} / ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout }}
    # Nim devel is informational — it surfaces upstream breakage before
    # it lands in stable but does NOT gate merge. Combined with
    # fail-fast: false, a devel-leg failure stays visible in the Checks
    # UI without blocking PRs.
    continue-on-error: ${{ matrix.nim-version == 'devel' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- stable (gating) ----
          - runs-on: ubuntu-latest
            nim-version: 'stable'
            sanitize-threads: 'yes'
            sanitize-address: 'yes'
            timeout: 25
          - runs-on: ubuntu-24.04-arm
            nim-version: 'stable'
            sanitize-threads: 'yes'
            sanitize-address: 'yes'
            timeout: 45
          - runs-on: macos-latest
            nim-version: 'stable'
            sanitize-threads: 'yes'
            sanitize-address: 'yes'
            timeout: 45
          # ---- devel (informational, non-gating via continue-on-error) ----
          - runs-on: ubuntu-latest
            nim-version: 'devel'
            sanitize-threads: 'yes'
            sanitize-address: 'yes'
            timeout: 45
          - runs-on: ubuntu-24.04-arm
            nim-version: 'devel'
            sanitize-threads: 'yes'
            sanitize-address: 'yes'
            timeout: 45
          - runs-on: macos-latest
            nim-version: 'devel'
            sanitize-threads: 'yes'
            sanitize-address: 'yes'
            timeout: 45

    steps:
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: ${HOME}/.cache
          # Include the nimble manifest + lockfile in the cache key so a
          # dep bump (lockfreequeues.nimble) or a lockfile resolution
          # (nimble.lock) invalidates the cache instead of silently
          # reusing a stale entry built against the previous resolution.
          key: cache-${{ matrix.runs-on }}-${{ matrix.nim-version }}-${{ hashFiles('lockfreequeues.nimble', 'nimble.lock') }}

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Nim ${{ matrix.nim-version }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q -y
          sudo apt-get -qq install -y clang

      - name: Install dependencies from nimble registry
        # Uses lockfreequeues.nimble `requires` lines (typestates >= 0.12.0,
        # debra >= 0.9.0, unittest2, nim >= 2.2.10) plus the pinned SHAs in
        # nimble.lock for deterministic resolution. `nimble install -dy`
        # fetches every dep without building the package itself; the
        # subsequent step's `nimble test` invokes the package's test task
        # and the deps are resolved from nimble's pkgs2 store.
        run: |
          nimble install -dy
          nimble setup
          # Hand-fix typestates v0.12.0 srcDir flattening (same as lint job).
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done

      - name: Run tests
        run: |
          set -o pipefail
          export SANITIZE_THREADS=${{ matrix.sanitize-threads }}
          export SANITIZE_ADDRESS=${{ matrix.sanitize-address }}
          # Workaround for nimble v0.20.x: `nimble <task>` exits 0 even when
          # an inner `exec` aborts the script (it logs `Error:` but does not
          # propagate the failure). Tee output and grep for nimble's error
          # markers to force a non-zero exit. See Item 8 / nimble issue.
          nimble_run() {
            local logfile
            logfile="$(mktemp)"
            "$@" 2>&1 | tee "$logfile"
            local rc=${PIPESTATUS[0]}
            if [[ $rc -ne 0 ]]; then
              return $rc
            fi
            if grep -Eq '^[[:space:]]*Error:' "$logfile"; then
              echo "::error::nimble reported an error but exited 0; failing the step."
              return 1
            fi
          }
          echo "::group::Run test suite (includes arc, orc, refc, lock-free enforcement)"
          nimble_run nimble test
          echo "::endgroup::"
          echo "::group::Run examples"
          nimble_run nimble examples
          echo "::endgroup::"
