# yamllint disable rule:line-length

name: build

# yamllint disable rule:truthy
on:
  pull_request:
    paths-ignore:
      - '*.md'
  push:
    paths-ignore:
      - '*.md'
# yamllint enable rule:truthy

# Cancel superseded runs on the same ref so a force-push or rapid
# successive pushes don't burn matrix-minutes on stale revisions.
# Scoped per (workflow, ref) so unrelated branches stay isolated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  lint:
    name: Lint (typestates verify)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install typestates
        run: nimble install -y "typestates@>= 0.10.0"

      - name: Typestates verify
        run: typestates verify -W --format=github src/

  test:
    name: Test nim-${{ matrix.nim-version }} / ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout }}
    # Nim devel is informational — it surfaces upstream breakage before
    # it lands in stable but does NOT gate merge. Combined with
    # fail-fast: false, a devel-leg failure stays visible in the Checks
    # UI without blocking PRs.
    continue-on-error: ${{ matrix.nim-version == 'devel' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- stable (gating) ----
          - runs-on: ubuntu-latest
            nim-version: 'stable'
            sanitize-threads: 'yes'
            sanitize-address: 'yes'
            timeout: 25
          - runs-on: ubuntu-24.04-arm
            nim-version: 'stable'
            sanitize-threads: 'yes'
            sanitize-address: 'yes'
            timeout: 45
          - runs-on: macos-latest
            nim-version: 'stable'
            sanitize-threads: 'yes'
            sanitize-address: 'yes'
            timeout: 25
          # ---- devel (informational, non-gating via continue-on-error) ----
          - runs-on: ubuntu-latest
            nim-version: 'devel'
            sanitize-threads: 'yes'
            sanitize-address: 'yes'
            timeout: 25
          - runs-on: ubuntu-24.04-arm
            nim-version: 'devel'
            sanitize-threads: 'yes'
            sanitize-address: 'yes'
            timeout: 45
          - runs-on: macos-latest
            nim-version: 'devel'
            sanitize-threads: 'yes'
            sanitize-address: 'yes'
            timeout: 25

    steps:
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: ${HOME}/.cache
          # Include the nimble manifest + lockfile in the cache key so a
          # dep bump (lockfreequeues.nimble) or a lockfile resolution
          # (nimble.lock) invalidates the cache instead of silently
          # reusing a stale entry built against the previous resolution.
          key: cache-${{ matrix.runs-on }}-${{ matrix.nim-version }}-${{ hashFiles('lockfreequeues.nimble', 'nimble.lock') }}

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Nim ${{ matrix.nim-version }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q -y
          sudo apt-get -qq install -y clang

      - name: Clone and install sibling deps (nim-debra, nim-typestates)
        # config.nims uses --path:"../nim-debra/src" and --path:"../nim-typestates/src"
        # for compiler-side resolution. Nimble's dep resolver runs BEFORE
        # the compiler though, and `nimble test` will refuse to launch if
        # `requires "debra >= 0.8.0"` is unsatisfiable from nimble's
        # package store. So fetch matching tags and `nimble install`
        # them locally to satisfy the resolver. Once nimble.directory has
        # picked up the new tags, this whole step can be replaced with a
        # plain `nimble install -d -y`.
        # Pinned to v0.8.0 / v0.10.0 (matching nimble.lock) for
        # deterministic CI; bump in lockstep with lockfreequeues.nimble's
        # `requires` and nimble.lock on any sibling release.
        run: |
          set -e
          cd ..
          git clone --depth 1 --branch v0.8.0 https://github.com/elijahr/nim-debra.git
          git clone --depth 1 --branch v0.10.0 https://github.com/elijahr/nim-typestates.git
          (cd nim-typestates && nimble install -y)
          (cd nim-debra && nimble install -y)

      - name: Vendor unittest2 (nim.cfg expects deps/unittest2)
        # deps/ is gitignored. nim.cfg has --path:"deps/unittest2".
        run: git clone --depth 1 https://github.com/status-im/nim-unittest2.git deps/unittest2

      - name: Run tests
        run: |
          set -o pipefail
          export SANITIZE_THREADS=${{ matrix.sanitize-threads }}
          export SANITIZE_ADDRESS=${{ matrix.sanitize-address }}
          # Workaround for nimble v0.20.x: `nimble <task>` exits 0 even when
          # an inner `exec` aborts the script (it logs `Error:` but does not
          # propagate the failure). Tee output and grep for nimble's error
          # markers to force a non-zero exit. See Item 8 / nimble issue.
          nimble_run() {
            local logfile
            logfile="$(mktemp)"
            "$@" 2>&1 | tee "$logfile"
            local rc=${PIPESTATUS[0]}
            if [[ $rc -ne 0 ]]; then
              return $rc
            fi
            if grep -Eq '^[[:space:]]*Error:' "$logfile"; then
              echo "::error::nimble reported an error but exited 0; failing the step."
              return 1
            fi
          }
          # Skip `nimble develop -y` — nim.cfg's --noNimblePath +
          # config.nims's explicit --path: directives mean nimble's
          # package resolver is not used. The sibling-clone step above
          # is what populates the local nimble store; going through
          # `nimble develop` would only add a redundant dep-resolution
          # round trip.
          echo "::group::Run test suite (includes arc, orc, refc, lock-free enforcement)"
          nimble_run nimble test
          echo "::endgroup::"
          echo "::group::Run examples"
          nimble_run nimble examples
          echo "::endgroup::"
