# yamllint disable rule:line-length

name: build

# yamllint disable rule:truthy
on:
  pull_request:
    paths-ignore:
      - '*.md'
  push:
    paths-ignore:
      - '*.md'
# yamllint enable rule:truthy

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: Test nim-${{ matrix.nim-version }} / ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04-arm
            nim-version: 'stable'
            sanitize-threads: 'yes'
            sanitize-address: 'yes'
          - runs-on: macos-latest
            nim-version: 'stable'
            sanitize-threads: 'yes'
            sanitize-address: 'yes'

    steps:
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: ${HOME}/.cache
          key: cache-${{ matrix.runs-on }}-${{ matrix.nim-version }}

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Nim ${{ matrix.nim-version }}
        uses: elijahr/vfox-nim@main
        with:
          nim-version: ${{ matrix.nim-version }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q -y
          sudo apt-get -qq install -y clang

      - name: Install dependencies
        run: nimble install --depsOnly -y

      - name: Vendor unittest2 (nim.cfg expects deps/unittest2)
        # deps/ is gitignored. nim.cfg has --path:"deps/unittest2".
        run: git clone --depth 1 https://github.com/status-im/nim-unittest2.git deps/unittest2

      - name: Run tests
        run: |
          set -o pipefail
          export SANITIZE_THREADS=${{ matrix.sanitize-threads }}
          export SANITIZE_ADDRESS=${{ matrix.sanitize-address }}
          # Workaround for nimble v0.20.x: `nimble <task>` exits 0 even when
          # an inner `exec` aborts the script (it logs `Error:` but does not
          # propagate the failure). Tee output and grep for nimble's error
          # markers to force a non-zero exit. See Item 8 / nimble issue.
          nimble_run() {
            local logfile
            logfile="$(mktemp)"
            "$@" 2>&1 | tee "$logfile"
            local rc=${PIPESTATUS[0]}
            if [[ $rc -ne 0 ]]; then
              return $rc
            fi
            if grep -Eq '^[[:space:]]*Error:' "$logfile"; then
              echo "::error::nimble reported an error but exited 0; failing the step."
              return 1
            fi
          }
          # Skip `nimble develop -y` — nim.cfg's --noNimblePath +
          # explicit --path: directives mean nimble's package resolver is
          # not used. The sibling-clone step above is what populates the
          # local nimble store; going through `nimble develop` would only
          # add a redundant dep-resolution round trip.
          echo "::group::Run test suite (includes arc, orc, refc, lock-free enforcement)"
          nimble_run nimble test
          echo "::endgroup::"
          echo "::group::Run examples"
          nimble_run nimble examples
          echo "::endgroup::"

  multi-nim:
    name: Multi-Nim (2.2.10, 2.2.12, devel) & Nimony / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Nim stable (bootstrap)
        uses: elijahr/vfox-nim@main
        with:
          nim-version: 'stable'

      - name: Cache Nim toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.choosenim/toolchains
            /opt/vfox/cache/nim
          key: nim-toolchains-${{ runner.os }}-2.2.10-2.2.12-devel
          restore-keys: |
            nim-toolchains-${{ runner.os }}-

      - name: Cache nimble packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimble/pkgs2
            ~/.nimble/bin
          key: nimble-${{ runner.os }}-multinim-${{ hashFiles('*.nimble') }}
          restore-keys: |
            nimble-${{ runner.os }}-multinim-
            nimble-${{ runner.os }}-stable-

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update -q -y
          sudo apt-get -qq install -y clang

      - name: Vendor unittest2 (nim.cfg expects deps/unittest2)
        run: git clone --depth 1 https://github.com/status-im/nim-unittest2.git deps/unittest2

      - name: Install dependencies
        run: nimble install --depsOnly -y

      - name: Test across multiple Nim versions (2.2.10, 2.2.12, devel)
        run: |
          set -o pipefail
          nimble_run() {
            local logfile
            logfile="$(mktemp)"
            "$@" 2>&1 | tee "$logfile"
            local rc=${PIPESTATUS[0]}
            if [[ $rc -ne 0 ]]; then
              return $rc
            fi
            if grep -Eq '^[[:space:]]*Error:' "$logfile"; then
              echo "::error::nimble reported an error but exited 0; failing the step."
              return 1
            fi
          }

          switch_toolchain() {
            local ver="$1"
            echo "::group::Switching toolchain to Nim ${ver}"
            if command -v choosenim &>/dev/null; then
              if [[ "$ver" == "devel" ]]; then
                choosenim devel --yes || choosenim "#head" --yes
              else
                choosenim "$ver" --yes
              fi
            elif command -v vfox &>/dev/null; then
              if [[ "$ver" == "devel" ]]; then
                vfox install nim@ref:devel || true
                vfox use nim@ref:devel || true
              else
                vfox install "nim@${ver}" || true
                vfox use "nim@${ver}" || true
              fi
            fi
            echo "Active compiler: $(nim --version | head -1)"
            echo "Active nimble:   $(nimble --version | head -1)"
            echo "::endgroup::"
          }

          VERSIONS=("2.2.10" "2.2.12" "devel")
          FAILED_STABLE=0
          FAILED_DEVEL=0

          for ver in "${VERSIONS[@]}"; do
            switch_toolchain "$ver"
            echo "::group::Run tests under Nim ${ver}"
            nimble install --depsOnly -y || true
            if nimble_run nimble test; then
              echo "✅ Nim ${ver} test suite passed."
            else
              if [[ "$ver" == "devel" ]]; then
                echo "::warning::Nim devel test suite failed (informational / upstream tracking)."
                FAILED_DEVEL=1
              else
                echo "::error::Nim ${ver} test suite failed!"
                FAILED_STABLE=1
              fi
            fi
            echo "::endgroup::"
            echo "::group::Run examples under Nim ${ver}"
            if nimble_run nimble examples; then
              echo "✅ Nim ${ver} examples passed."
            else
              if [[ "$ver" == "devel" ]]; then
                echo "::warning::Nim devel examples failed (informational / upstream tracking)."
                FAILED_DEVEL=1
              else
                echo "::error::Nim ${ver} examples failed!"
                FAILED_STABLE=1
              fi
            fi
            echo "::endgroup::"
          done

          if [[ $FAILED_STABLE -ne 0 ]]; then
            echo "::error::One or more release versions of Nim failed tests."
            exit 1
          fi

